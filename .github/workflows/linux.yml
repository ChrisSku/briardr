# Linux checks: typecheck, the Rust checks, the licenses and sources of the server's crates (cargo-deny; their
# advisories are checked in audit.yml), the integration suite and the browser checks (each builds the client
# and runs against its own Herdr session), the workflows (actionlint), the setup helper and the installer
# (shellcheck), and the generated deployment files (systemd units, Caddy site). Every change runs all of them,
# and packages the release archives for every platform, macOS ones on macOS (package.yml).
# Mac-only integrations (power, dictation, Keychain) are covered by stubbed tests or skipped here.
# When they pass on main, the release workflow versions and releases the changesets the merge brought.
# The "Version X.Y.Z" commits it pushes only check the version (the version job): they change nothing
# else, the merge before each one ran everything, and the release run packages them.
# Actions are pinned to commits; the comment names the release each one is.
name: linux

# Each pull request runs once, as pull_request (its branch merged into main), not again for the push to
# its branch; a branch without a pull request isn't checked until it has one. Pushes run on main only.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces. Each commit on main runs in a group of its
# own, so none of them is cancelled or held back: the release workflow reads every one.
concurrency:
  group: linux-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.actor != 'briardr-release[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.1; Bun and Rust at the versions pinned in mise.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2; the server's dependencies, built and saved on main
        with:
          workspaces: server
          cache-bin: false # it only holds the rustup commands mise sets up
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts check # the version agrees across Cargo, package.json, CHANGELOG.md and the install docs
      - run: mise run typecheck

      - name: Herdr (the version and checksum pinned for servers)
        run: |
          . deploy/versions.env
          curl -fsSL "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-linux-x86_64" -o herdr
          echo "$HERDR_SHA256_LINUX_X86_64  herdr" | sha256sum -c -
          install -D -m 0755 herdr "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: herdr-core (the version and checksum the tests run against)
        run: |
          . deploy/versions.env
          curl -fsSL "https://releases.herdr.dev/core/$HERDR_CORE_VERSION/herdr-core-linux-x86_64.tar.gz" -o hc.tar.gz
          echo "$HERDR_CORE_SHA256_LINUX_X86_64  hc.tar.gz" | sha256sum -c -
          mkdir hc && tar -xzf hc.tar.gz -C hc
          # As its installer lays it out: another machine is reached through `herdr-core connect`.
          install -D -m 0755 hc/herdr-core "$HOME/.local/bin/herdr-core"
          ln -s herdr-core "$HOME/.local/bin/hc"
          hc --version

      - run: mise run check
      - name: Licenses and sources of the server's crates
        run: mise run deps:check
      - run: mise run test

      - name: Workflows, setup helper and installer
        run: mise run lint

      - name: Deployment files
        run: |
          mise run build:server
          briardr=server/target/release/briardr
          BRIARDR_DATA_DIR=$(mktemp -d)
          export BRIARDR_DATA_DIR
          $briardr configure --mode proxy --public-origin https://briardr.example.com --preview-origin 'https://p{n}.briardr.example.com' --herdr-path "$HOME/.local/bin/herdr"
          out=$(mktemp -d)
          BRIARDR_SERVICE_PATH="$HOME/.local/bin:/usr/bin:/bin" $briardr systemd-units "$out"
          systemd-analyze verify "$out/briardr-herdr.service" "$out/briardr.service"
          $briardr caddyfile > "$out/briardr.caddy"
          . deploy/versions.env # the Caddy version servers fall back to
          docker run --rm -v "$out:/etc/caddy:ro" "caddy:$CADDY_VERSION" caddy validate --config /etc/caddy/briardr.caddy --adapter caddyfile

      # WebKit and the system packages it needs, about 225 MB from Playwright's CDN and the runner's Ubuntu
      # mirror, are cached for the runner image and the Playwright version, and saved on main. The mirror can
      # crawl: on 2026-11-18 it sent the packages at 100 kB/s for 22 minutes, and the job ran out of time in
      # the last browser check. With the cache a run downloads only the packages Ubuntu has updated since,
      # and a cache saved for an earlier image or Playwright still holds most of them.
      - name: WebKit's cache key (the runner image and the Playwright version)
        id: webkit-key
        run: |
          echo "prefix=webkit-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "key=webkit-$ImageOS-$ImageVersion-$(bun --bun playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore WebKit and its system libraries
        id: webkit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/webkit-packages
          key: ${{ steps.webkit-key.outputs.key }}
          restore-keys: ${{ steps.webkit-key.outputs.prefix }}
      - name: WebKit and its system libraries
        timeout-minutes: 10 # a slow download fails here, by name, instead of using up the job's time
        run: |
          # apt-get installs a package from its archive folder when the file there is the version it
          # wants, and downloads the others. The folder, less what Ubuntu no longer serves, is then cached.
          packages=~/.cache/webkit-packages
          mkdir -p "$packages"
          find "$packages" -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +
          bun --bun playwright install --with-deps webkit
          sudo apt-get autoclean -qq
          rm -f "$packages"/*.deb
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$packages" {} +
      - name: Save WebKit and its system libraries
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/webkit-packages
          key: ${{ steps.webkit-key.outputs.key }}

      - name: Browser checks (WebKit)
        timeout-minutes: 15 # about 6 minutes
        run: mise run test:ui

  package:
    if: github.actor != 'briardr-release[bot]'
    uses: ./.github/workflows/package.yml

  # A run whose jobs are all skipped counts as skipped, not passed, and the release workflow only follows
  # passed runs: it needs the one for a version commit to release that version if its own run failed.
  version:
    if: github.actor == 'briardr-release[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts check
