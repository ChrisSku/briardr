# Linux checks: typecheck, the Rust checks, the integration suite and the browser checks (each builds the client
# and runs against its own Herdr session), the workflows (actionlint), the setup helper (shellcheck) and the
# generated deployment files (systemd units, Caddy site). Every change runs all of them, and packages the
# release archives for every platform, macOS ones on macOS (package.yml).
# Mac-only integrations (power, dictation, Keychain) are covered by stubbed tests or skipped here.
# When they pass on main, the release workflow versions and releases the changesets the merge brought.
# Actions are pinned to commits; the comment names the release each one is.
name: linux

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1; Bun and Rust at the versions pinned in mise.toml

      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts check # the version agrees across Cargo, package.json, CHANGELOG.md and the install docs
      - run: mise run typecheck

      - name: Herdr (the version and checksum pinned for servers)
        run: |
          . deploy/linux/versions.env
          curl -fsSL "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-linux-x86_64" -o herdr
          echo "$HERDR_SHA256_X86_64  herdr" | sha256sum -c -
          install -D -m 0755 herdr "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: mise run check
      - run: mise run test

      - name: Workflows and setup helper
        run: mise run lint

      - name: Deployment files
        run: |
          mise run build:server
          briardr=server/target/release/briardr
          BRIARDR_DATA_DIR=$(mktemp -d)
          export BRIARDR_DATA_DIR
          $briardr configure --mode proxy --public-origin https://briardr.example.com --preview-origin 'https://p{n}.briardr.example.com' --herdr-path "$HOME/.local/bin/herdr"
          out=$(mktemp -d)
          BRIARDR_SERVICE_PATH="$HOME/.local/bin:/usr/bin:/bin" $briardr systemd-units "$out"
          systemd-analyze verify "$out/briardr-herdr.service" "$out/briardr.service"
          $briardr caddyfile > "$out/briardr.caddy"
          . deploy/linux/versions.env # the Caddy version servers fall back to
          docker run --rm -v "$out:/etc/caddy:ro" "caddy:$CADDY_VERSION" caddy validate --config /etc/caddy/briardr.caddy --adapter caddyfile

      - name: Browser checks (WebKit, with the system libraries it needs)
        run: |
          bun --bun playwright install --with-deps webkit
          mise run test:ui

  package:
    uses: ./.github/workflows/package.yml
