# Versions and releases what merges bring to main, once the Linux checks pass on it:
# - Changesets waiting on main (.changeset/*.md, one per pull request) become a new version.
#   `changeset version` sets it in package.json and writes their CHANGELOG.md section, scripts/release.ts
#   copies it to the other files, and the release GitHub App pushes that to main as "Version X.Y.Z" (the
#   main ruleset lets the App push without a pull request).
# - The same run releases it: the commit is tagged vX.Y.Z right away, since the install instructions it
#   pushed clone the tag; then the archives that run Briardr without a checkout (scripts/package.ts) are
#   built on each platform, and the release is published with them, its notes the version's CHANGELOG.md
#   section. The Linux checks on that commit afterwards only check the version, which is all it changes.
# - Every run first releases the version on main if it has no release yet (its run failed after the
#   push), at its "Version X.Y.Z" commit, so a newer version never skips it. A version pushed by that same
#   run is tagged, and released by the run for its own commit.
# A merge with only empty changesets releases nothing; they're removed with the next version.
# Actions are pinned to commits; the comment names the release each one is.
name: release

on:
  workflow_run:
    workflows: [linux]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One at a time, so two quick merges can't push two versions or release one twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Pushes only: a pull request from a fork's branch named main must not release anything.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # to tag the commit
    outputs: # what this run releases: main's unreleased version, else the one it pushed
      version: ${{ steps.unreleased.outputs.version || steps.pushed.outputs.version }}
      commit: ${{ steps.unreleased.outputs.commit || steps.pushed.outputs.commit }}
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      LEFTHOOK: 0 # no git hooks: the version commit has no changeset of its own (lefthook doesn't install on CI anyway)
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the changelog links each entry to the pull request that merged it
          persist-credentials: false # the version is pushed with the App's token instead
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: bun
      - run: bun install --frozen-lockfile

      - name: The version on main, if its run didn't release it
        id: unreleased
        run: bun scripts/release.ts tag

      - name: Version the changesets
        id: version
        run: |
          before=$(bun scripts/release.ts version)
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then # it fails without any
            bun --bun changeset version
            bun scripts/release.ts sync
          fi
          after=$(bun scripts/release.ts version)
          if [ "$after" = "$before" ]; then
            echo "no changesets to release"
          elif [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$COMMIT" ]; then
            echo "main has moved on; the run for its newest commit versions these changesets"
          else
            bun scripts/release.ts check
            echo "version=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: App token
        id: app
        if: steps.version.outputs.version
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the version
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git add -A
          git commit -m "Version $VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/main

      - name: Tag the version
        id: pushed
        if: steps.version.outputs.version
        run: bun scripts/release.ts tag

  build:
    needs: version
    if: needs.version.outputs.version
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.version.outputs.commit }}
      tag: v${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: bun
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: briardr-*
          path: dist
          merge-multiple: true
      - name: Release the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts publish dist
