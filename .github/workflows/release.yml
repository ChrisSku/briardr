# Versions and releases what merges bring to main, once the Linux checks pass on it:
# - Changesets waiting on main (.changeset/*.md, one per pull request) become a new version.
#   `changeset version` sets it in package.json and writes their CHANGELOG.md section, scripts/release.ts
#   copies it to the other files, and the release GitHub App pushes that to main as "Version X.Y.Z" (the
#   main ruleset lets the App push without a pull request). That push runs the Linux checks again, and
#   then this workflow, which releases it:
# - A version on main without a release is released: the commit is tagged vX.Y.Z, and the notes are the
#   version's CHANGELOG.md section.
# A merge with only empty changesets releases nothing; they're removed with the next version.
# Actions are pinned to commits; the comment names the release each one is.
name: release

on:
  workflow_run:
    workflows: [linux]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One at a time, so two quick merges can't push two versions.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Pushes only: a pull request from a fork's branch named main must not release anything.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # to tag the commit and create the release
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      LEFTHOOK: 0 # no git hooks: the version commit has no changeset of its own (lefthook doesn't install on CI anyway)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the changelog links each entry to the pull request that merged it
          persist-credentials: false # the version is pushed with the App's token instead
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: bun
      - run: bun install --frozen-lockfile

      - name: Version the changesets
        id: version
        run: |
          before=$(bun scripts/release.ts version)
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then # it fails without any
            bun --bun changeset version
            bun scripts/release.ts sync
          fi
          after=$(bun scripts/release.ts version)
          if [ "$after" = "$before" ]; then
            echo "no changesets to release"
          elif [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$COMMIT" ]; then
            echo "main has moved on; the run for its newest commit versions these changesets"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            bun scripts/release.ts check
            echo "version=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: App token
        id: app
        if: steps.version.outputs.version
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the version
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git add -A
          git commit -m "Version $VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/main

      - name: Release
        if: ${{ !steps.version.outputs.version && !steps.version.outputs.skip }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -- . # undo what versioning only empty changesets did
          tag="v$(bun scripts/release.ts version)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          bun scripts/release.ts check "$tag"
          bun scripts/release.ts notes "$tag" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$COMMIT" --title "Briardr ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md"
