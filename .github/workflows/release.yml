# Publishes a GitHub release when a version tag is pushed (`git tag v0.1.0 && git push origin v0.1.0`).
# The tag must match the version in server/Cargo.toml and everything scripts/release.ts checks, and the
# Linux checks must pass on the tagged commit. The notes are the version's section of CHANGELOG.md.
# Actions are pinned to commits; the comment names the release each one is.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: bun
      - run: bun scripts/release.ts check "$GITHUB_REF_NAME"

  linux:
    uses: ./.github/workflows/linux.yml

  release:
    needs: [version, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: bun
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release.ts notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Briardr ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
