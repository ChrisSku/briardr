name: Bug report
description: Report a reproducible problem with Briardr.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md and report privately.
        Remove pairing codes, keys, WireGuard QR codes, credentials, and personal terminal data.
  - type: textarea
    id: environment
    attributes:
      label: Your setup
      description: Briardr commit (Settings → About), Herdr version, host OS/architecture, client OS/browser, and access mode (Tailscale, WireGuard, or public HTTPS).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include sanitized errors or screenshots if useful.
    validations:
      required: true
