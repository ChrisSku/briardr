<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0c0b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Briardr" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="briardr-version" content="%VERSION%" />
    <meta name="briardr-release" content="%RELEASE%" />
    <meta name="briardr-branch" content="%BRANCH%" />
    <meta name="briardr-commit" content="%COMMIT%" />
    <title>Briardr</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    %IMPORT_MAP%
    %APP_CSS%
  </head>
  <body>
    <div id="app"></div>
    <noscript>Briardr needs JavaScript.</noscript>
    <script type="module" src="%APP_JS%"></script>
  </body>
</html>
